services:
  db:
    image: mariadb:5.5
    container_name: cos20031_app_db
    environment:
      MYSQL_ROOT_PASSWORD: apppass
      MYSQL_DATABASE: cos20031
      TZ: Australia/Melbourne
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - cos20031_db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  cos20031_db_data:
